  <style>
    :root{
      --ink:#0E2240;        /* navy: text + sidebar */
      --ink-2:#4A5B74;      /* secondary text */
      --ink-3:#8593A8;      /* muted text */
      --paper:#F3F6FA;      /* page background */
      --card:#FFFFFF;
      --line:#DCE3EC;
      --bhfl:#3A6AAE;       /* BHFL blue, from the logo */
      --bfs:#3E72B5;        /* Bajaj Finserv blue, from the logo */
      --ok:#0E8A4F; --warn:#B7791F; --bad:#C62828;
    }
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
    html,body,#root{height:100%;width:100%}
    body{font-family:'Hanken Grotesk','Noto Sans Devanagari',system-ui,sans-serif;background:var(--paper);color:var(--ink);-webkit-font-smoothing:antialiased}
    button,input,select{font-family:inherit}
    :focus-visible{outline:2px solid var(--ink);outline-offset:2px}
    input:focus,select:focus{border-color:var(--ink)!important;outline:none}

    @keyframes enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
    @keyframes ring{0%{transform:scale(1);opacity:.5}100%{transform:scale(1.55);opacity:0}}
    @keyframes spin{to{transform:rotate(360deg)}}
    .enter{animation:enter .45s cubic-bezier(.16,1,.3,1) both}
    @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

    .shell{display:flex;height:100vh;width:100vw;overflow:hidden}
    .side{width:272px;min-width:272px;background:var(--ink);color:#fff;display:flex;flex-direction:column}
    .main{flex:1;overflow:auto}
    .wrap{padding:40px 48px;max-width:1080px;margin:0 auto}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
    .split{display:flex;gap:20px;align-items:flex-start}
    .split > .right{flex:0 0 330px;display:flex;flex-direction:column;gap:16px}
    .pick{display:grid;grid-template-columns:1fr 1fr;gap:20px}

    @media (max-width:860px){
      .shell{flex-direction:column;height:auto;min-height:100vh;overflow:visible}
      .side{width:100%;min-width:0}
      .side nav{display:flex;gap:6px;overflow-x:auto}
      .side nav button{white-space:nowrap}
      .side .side-foot{display:none}
      .main{overflow:visible}
      .wrap{padding:28px 18px}
      .split{flex-direction:column}
      .split > .right{flex:1 1 auto;width:100%}
      .pick{grid-template-columns:1fr}
    }
  </style>
</head>

function ErrorBox({msg}){
  if(!msg)return null;
  return <div role="alert" style={{padding:"12px 16px",background:"#FDECEC",border:"1px solid #F3C4C4",borderRadius:10,color:"var(--bad)",fontSize:14,marginBottom:18,wordBreak:"break-word"}}>{msg}</div>;
}

function PulseRing({color,size=128,status}){
  const term=TERMINAL.includes(status), act=status==="IN_PROGRESS";
  const m=STATUS_META[status]||STATUS_META.NOT_STARTED;
  return(
    <div style={{position:"relative",width:size,height:size,margin:"0 auto"}}>
      {!term&&[0,.6,1.2].map(d=><div key={d} style={{position:"absolute",inset:0,borderRadius:"50%",border:`2px solid ${color}55`,animation:`ring 2s ease-out infinite ${d}s`}}/>)}
      <div style={{position:"absolute",inset:12,borderRadius:"50%",background:`${color}12`,border:`2px solid ${color}55`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:size*.3}}>{m.icon}</div>
      {act&&<div style={{position:"absolute",inset:4,borderRadius:"50%",border:"2px solid transparent",borderTopColor:color,animation:"spin 3s linear infinite"}}/>}
    </div>
  );
}

function ElapsedTimer({startTime,endTime}){
  const[el,setEl]=useState(0);
  useEffect(()=>{
    if(!startTime)return;
    if(endTime){setEl(Math.round((new Date(endTime)-new Date(startTime))/1000));return;}
    const iv=setInterval(()=>setEl(Math.round((Date.now()-new Date(startTime).getTime())/1000)),1000);
    return()=>clearInterval(iv);
  },[startTime,endTime]);
  if(!startTime)return null;
  return<span style={{fontSize:30,fontWeight:700,fontVariantNumeric:"tabular-nums"}}>{String(Math.floor(el/60)).padStart(2,"0")}:{String(el%60).padStart(2,"0")}</span>;
}

// Section mark: the logo if the section has one, otherwise a letter tile in its colour.
function SectionMark({s,size=44,ring=false}){
  const st={width:size,height:size,borderRadius:"50%",flexShrink:0,boxShadow:ring?"0 0 0 2px #fff":"none"};
  return s.logo
    ?<img src={s.logo} alt={`${s.name} logo`} width={size} height={size} style={{...st,display:"block"}}/>
    :<span aria-hidden="true" style={{...st,background:s.hex,color:"#fff",display:"inline-flex",alignItems:"center",justifyContent:"center",fontWeight:800,fontSize:size*.48}}>{s.short[0]}</span>;
}

function SectionPicker({onPick}){
  return(
    <div className="wrap enter">
      <h1 style={{fontSize:34,fontWeight:800,letterSpacing:"-.025em",lineHeight:1.15,marginBottom:10}}>Bajaj Voice AI Playground</h1>

}

function DetailsScreen({section,onSave}){
  const s=SECTIONS[section];
  const[f,setF]=useState({firstName:"",lastName:"",countryCode:"+91",mobile:""});
  const ok=f.firstName.trim()&&f.lastName.trim()&&f.mobile;
  return(
    <div style={{display:"flex",alignItems:"center",justifyContent:"center",minHeight:"100%",padding:"40px 20px"}}>
      <div className="enter" style={{width:"100%",maxWidth:440}}>
        <h1 style={{fontSize:28,fontWeight:800,letterSpacing:"-.02em",marginBottom:8}}>Who should the agent call?</h1>
        <p style={{fontSize:15,color:"var(--ink-2)",marginBottom:28,lineHeight:1.5}}>You'll play the customer. The demo call goes to this number.</p>

            <div style={{flex:1}}><label style={S.lbl}>First name</label><input value={f.firstName} onChange={e=>setF({...f,firstName:e.target.value})} placeholder="First name" style={S.inp}/></div>
            <div style={{flex:1}}><label style={S.lbl}>Last name</label><input value={f.lastName} onChange={e=>setF({...f,lastName:e.target.value})} placeholder="Last name" style={S.inp}/></div>

              <input value={f.mobile} onChange={e=>setF({...f,mobile:e.target.value.replace(/[^0-9]/g,"")})} onKeyDown={e=>e.key==="Enter"&&ok&&onSave(f)} placeholder="10-digit mobile" type="tel" style={{...S.inp,flex:1,width:"auto"}}/>

  return(
    <div style={{...S.card,padding:22,display:"flex",flexDirection:"column",borderTop:`4px solid ${plc?"var(--line)":s.hex}`}}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:8,marginBottom:12}}>
        <span style={{fontSize:13,fontWeight:600,color:s.hex,background:s.hex+"14",padding:"4px 10px",borderRadius:20}}>{ag.langNative}{ag.langNative!==ag.lang?` · ${ag.lang}`:""}</span>
        {plc&&<span style={{fontSize:12,fontWeight:600,color:"var(--warn)"}}>Agent ID needed</span>}
      </div>
      <h3 style={{fontSize:18,fontWeight:700,letterSpacing:"-.01em",marginBottom:2}}>{ag.useCase}</h3>
      <p style={{fontSize:14,color:"var(--ink-3)",marginBottom:10}}>{ag.name}</p>
      <p style={{fontSize:14,color:"var(--ink-2)",lineHeight:1.5,marginBottom:18,flex:1}}>{ag.desc}</p>
      <button onClick={()=>onCall(ag)} disabled={plc||busy!==null} style={{...S.primary(!plc&&busy===null,s.hex),width:"100%",fontSize:14,padding:"12px 16px"}}>
        {mine?<><div style={{width:15,height:15,border:"2px solid #fff6",borderTopColor:"#fff",borderRadius:"50%",animation:"spin .8s linear infinite"}}/>Starting call</>:<><PhoneIcon/>{plc?"Add agent ID to call":"Start call"}</>}
      </button>
      <div style={{marginTop:10,fontSize:11,color:"var(--ink-3)",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}} title={ag.id}>ID: {ag.id}</div>
    </div>
  );
}

function AgentsScreen({section,user,busy,error,onCall}){
  const s=SECTIONS[section];
  const langs=[...new Set(s.agents.map(a=>a.lang))];
  const[lang,setLang]=useState("All");
  useEffect(()=>setLang("All"),[section]);
  const list=s.agents.filter(a=>lang==="All"||a.lang===lang);
  return(
    <div className="wrap">
      <div className="enter" style={{marginBottom:26}}>
        <div style={{display:"flex",alignItems:"center",gap:14,marginBottom:10}}>
          <SectionMark s={s} size={48}/>
          <h1 style={{fontSize:30,fontWeight:800,letterSpacing:"-.025em"}}>{s.name} agents</h1>
        </div>
        <p style={{fontSize:15,color:"var(--ink-2)",lineHeight:1.55}}>Pick an agent to call <strong style={{color:"var(--ink)"}}>{user.firstName}</strong> on <strong style={{color:"var(--ink)"}}>{dispNum(user)}</strong>. You play the customer.</p>
      </div>
      {langs.length>1&&(
        <div style={{display:"flex",flexWrap:"wrap",gap:8,marginBottom:20}}>
          {["All",...langs].map(l=>{
            const on=l===lang, n=l==="All"?s.agents.length:s.agents.filter(a=>a.lang===l).length;
            return <button key={l} onClick={()=>setLang(l)} aria-pressed={on} style={{padding:"7px 14px",borderRadius:20,border:`1px solid ${on?s.hex:"var(--line)"}`,background:on?s.hex:"#fff",color:on?"#fff":"var(--ink-2)",fontSize:13,fontWeight:600,cursor:"pointer"}}>{l} ({n})</button>;
          })}
        </div>
      )}
      <ErrorBox msg={error}/>
      <div className="grid">{list.map(ag=><AgentCard key={ag.id} ag={ag} section={section} busy={busy} onCall={onCall}/>)}</div>
    </div>
  );
}

function CallDialog({agent,section,user,onCancel,onStart}){
  const s=SECTIONS[section];
  const fields=agent.fields||[];
  const[vals,setVals]=useState(()=>Object.fromEntries(fields.map(f=>[f.key,""])));
  const ok=fields.every(f=>f.required===false||String(vals[f.key]||"").trim());
  useEffect(()=>{const h=e=>e.key==="Escape"&&onCancel();window.addEventListener("keydown",h);return()=>window.removeEventListener("keydown",h);},[onCancel]);
  return(
    <div onClick={onCancel} style={{position:"fixed",inset:0,background:"rgba(14,34,64,.45)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:100,padding:20}}>
      <div role="dialog" aria-modal="true" className="enter" onClick={e=>e.stopPropagation()} style={{...S.card,width:"100%",maxWidth:440,padding:26,borderTop:`4px solid ${s.hex}`}}>
        <h3 style={{fontSize:20,fontWeight:700,marginBottom:4}}>{agent.useCase}</h3>
        <p style={{fontSize:14,color:"var(--ink-2)",marginBottom:20}}>{agent.name}, {agent.lang}. Calling {user.firstName} on {dispNum(user)}.</p>
        {fields.length>0&&(
          <div style={{display:"flex",flexDirection:"column",gap:14,marginBottom:22}}>
            {fields.map((f,i)=>(
              <div key={f.key}><label style={S.lbl}>{f.label}{f.required===false?" (optional)":""}</label>
                <input autoFocus={i===0} value={vals[f.key]} onChange={e=>setVals({...vals,[f.key]:e.target.value})} placeholder={f.placeholder||""} style={S.inp}/></div>
            ))}
          </div>
        )}
        <div style={{display:"flex",gap:10}}>
          <button onClick={onCancel} style={{...S.ghost,flex:1}}>Cancel</button>
          <button autoFocus={fields.length===0} disabled={!ok} onClick={()=>onStart(vals)} style={{...S.primary(ok,s.hex),flex:2}}><PhoneIcon/> Start call</button>
        </div>
      </div>
    </div>
  );
}

function Monitor({section,call,data,user,onBack}){
  const s=SECTIONS[section];
  const raw=data?normSt(data.status):"NOT_STARTED";
  const cur=STATUS_META[raw]?raw:"NOT_STARTED";
  const meta=STATUS_META[cur], term=TERMINAL.includes(cur), c=s.hex;
  const hasResult=data?.result&&Object.keys(data.result).length>0;
  const rows=[
    ["Status",term?meta.label:null,term?meta.color:null],
    ["Engagement",data?.engagement_status||null,data?.engagement_status==="ENGAGED"?"var(--ok)":data?.engagement_status==="NOT_ENGAGED"?"var(--warn)":null],
    ["Duration",data?.duration_seconds?fmtDur(data.duration_seconds):null],
    ["Customer speech",data?.user_speech_duration?fmtDur(data.user_speech_duration):null],
    ["Answered by",data?.answered_by||null],
    ["Call ended by",data?.call_ended_by||null],
    ["Language",data?.language||call.agent.lang],
    ["Started at",data?.started_at?new Date(data.started_at).toLocaleTimeString():null],
    ["Ended at",data?.ended_at?new Date(data.ended_at).toLocaleTimeString():null],
  ];
  const panelTitle={fontSize:15,fontWeight:700,marginBottom:14};
  return(
    <div className="wrap">
      <button onClick={onBack} style={{background:"none",border:"none",color:"var(--ink-2)",cursor:"pointer",display:"flex",alignItems:"center",gap:6,fontSize:14,fontWeight:500,marginBottom:18,padding:0}}><BackIcon/> Back to {s.short} agents</button>
      <h1 style={{fontSize:28,fontWeight:800,letterSpacing:"-.02em",marginBottom:4}}>{call.agent.useCase}</h1>
      <p style={{fontSize:15,color:"var(--ink-2)",marginBottom:24}}>{s.name}, {call.agent.name}, {call.agent.lang}</p>
      <div className="split">
        <div style={{flex:1,minWidth:0,width:"100%"}}>
          <div style={{...S.card,padding:"38px 28px",textAlign:"center"}}>
            <PulseRing color={c} status={cur}/>
            <div style={{marginTop:22}}><span style={{fontSize:14,fontWeight:700,color:meta.color,background:meta.color+"18",padding:"6px 14px",borderRadius:20}}>{meta.label}</span></div>
            <div style={{marginTop:18,minHeight:38}}>
              <ElapsedTimer startTime={data?.started_at} endTime={term?data?.ended_at:null}/>
              {!data?.started_at&&<span style={{fontSize:14,color:"var(--ink-3)"}}>Waiting for the customer to pick up</span>}
            </div>
            <div style={{display:"flex",justifyContent:"center",gap:4,marginTop:22}} aria-hidden="true">
              {PIPELINE.map(st=>{const sn=STATUS_META[st].step,ic=st===cur,ip=sn<meta.step;return<div key={st} style={{width:ic?32:8,height:8,borderRadius:4,background:ip||ic?c:"var(--line)",opacity:ip?.5:1,transition:"all .4s"}}/>;})}
            </div>
            <div style={{display:"flex",justifyContent:"center",flexWrap:"wrap",gap:"14px 32px",marginTop:26,fontSize:13}}>
              {[["Customer",data?.callee_name||user.firstName],["Number",data?.mobile_number||dispNum(user)],["Call ID",call.callId?.slice(0,12)+"…"]].map(([k,v])=>(
                <div key={k}><div style={{color:"var(--ink-3)"}}>{k}</div><div style={{fontWeight:600}}>{v}</div></div>
              ))}
            </div>
            {!term&&<p style={{marginTop:22,fontSize:13,color:"var(--ink-3)",animation:"pulse 2s infinite"}}>Checking for updates every {POLL_INTERVAL/1000}s</p>}
          </div>
          {term&&<div style={{textAlign:"center",marginTop:16}}><button onClick={onBack} style={{...S.primary(true,c),display:"inline-flex",padding:"13px 28px"}}>Try another agent</button></div>}
        </div>
        <div className="right">
          <div style={{...S.card,padding:22}}>
            <h3 style={panelTitle}>Call details</h3>
            <div style={{borderRadius:10,overflow:"hidden",border:"1px solid var(--line)"}}>
              {rows.map(([l,v,vc],i)=>(
                <div key={l} style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:12,padding:"10px 14px",background:i%2?"#fff":"#F7F9FC",borderBottom:i<rows.length-1?"1px solid var(--line)":"none"}}>
                  <span style={{fontSize:13,color:"var(--ink-3)"}}>{l}</span>
                  {v?<span style={{fontSize:13,fontWeight:600,color:vc||"var(--ink)",textAlign:"right"}}>{v}</span>
                    :<div style={{width:56,height:9,borderRadius:4,background:"var(--line)",animation:!term?"pulse 2s infinite":"none"}}/>}
                </div>
              ))}
            </div>
            {data?.recording_url&&<div style={{marginTop:16}}><div style={{fontSize:13,color:"var(--ink-3)",marginBottom:8}}>Recording</div><audio controls src={data.recording_url} style={{width:"100%",height:36}}/></div>}
          </div>
          <div style={{...S.card,padding:22,borderColor:hasResult?c+"66":"var(--line)"}}>
            <h3 style={panelTitle}>What the agent captured</h3>
            {hasResult?(
              <div style={{borderRadius:10,overflow:"hidden",border:"1px solid var(--line)"}}>
                {Object.entries(data.result).map(([k,v],i,arr)=>(
                  <div key={k} style={{padding:"11px 14px",background:i%2?"#fff":"#F7F9FC",borderBottom:i<arr.length-1?"1px solid var(--line)":"none"}}>
                    <div style={{fontSize:12,color:"var(--ink-3)",textTransform:"capitalize",marginBottom:4}}>{k.replace(/_/g," ")}</div>
                    <div style={{fontSize:14,fontWeight:600,color:c,lineHeight:1.5,wordBreak:"break-word",whiteSpace:"pre-wrap"}}>{typeof v==="object"?JSON.stringify(v,null,2):String(v)}</div>
                  </div>
                ))}
              </div>
            ):<p style={{fontSize:14,color:"var(--ink-3)"}}>{term?"No output variables came back for this call.":"Shows up here once the call ends."}</p>}
          </div>
        </div>
      </div>
    </div>
  );
}

function About(){
  const caps=["Agents in Hindi, English and regional languages, including code-mixed speech","Sub-second replies with real-time speech understanding","Works with existing telephony (SIP, PSTN, WebRTC) and CRMs","Custom voices and agent personas","Call outcomes and analytics after every call"];
  return(
    <div className="wrap enter" style={{maxWidth:720}}>
      <h1 style={{fontSize:32,fontWeight:800,letterSpacing:"-.025em",marginBottom:20}}>About Hunar.ai</h1>
      <div style={{...S.card,padding:"30px 28px",fontSize:15,color:"var(--ink-2)",lineHeight:1.7}}>
        <p style={{fontSize:17,color:"var(--ink)",fontWeight:500,marginBottom:16}}>Hunar.ai is a conversational voice AI company. It builds enterprise voice agents that hold natural, human-like conversations at scale.</p>
        <p style={{marginBottom:14}}>Enterprises use the platform to automate high-volume outbound and inbound calls across BFSI, eCommerce, logistics and healthcare.</p>
        <p style={{marginBottom:22}}>Its speech models are tuned for Indian languages and code-mixed conversation, and the platform connects to existing CRM, telephony and data systems, so teams go live in days.</p>
        <h3 style={{fontSize:15,fontWeight:700,color:"var(--ink)",marginBottom:8}}>What it does</h3>
        <ul style={{paddingLeft:20,marginBottom:22}}>{caps.map(c=><li key={c} style={{marginBottom:4}}>{c}</li>)}</ul>
        <h3 style={{fontSize:15,fontWeight:700,color:"var(--ink)",marginBottom:8}}>Customers</h3>
        <p style={{marginBottom:22}}>Bajaj Finserv, Swiggy, Delhivery, Blue Dart, Aditya Birla Capital, Tata 1mg, Dr. Lal Path Labs</p>
        <p>More at <a href="https://www.hunar.ai" target="_blank" rel="noopener noreferrer" style={{color:"var(--bhfl)",fontWeight:600}}>hunar.ai</a></p>
      </div>
    </div>
  );
}

/* ---------- App ---------- */

function App(){
  const[section,setSection]=useState(null);          // "bhfl" | "bfs" | null
  const[page,setPage]=useState("home");              // home | section | monitor | about
  const[user,setUser]=useState(null);
  const[dialog,setDialog]=useState(null);
  const[busy,setBusy]=useState(null);
  const[error,setError]=useState(null);
  const[call,setCall]=useState(null);
  const[callData,setCallData]=useState(null);
  const pollRef=useRef(null);

  const stopPoll=()=>{if(pollRef.current){clearInterval(pollRef.current);pollRef.current=null;}};
  useEffect(()=>stopPoll,[]);

  const headersFor=()=>({"Content-Type":"application/json"});

  const fetchStatus=useCallback(async(id,sec)=>{
    try{
      const res=await fetch(`${API_BASE}/api/call-status?id=${encodeURIComponent(id)}`,{headers:headersFor(sec)});
      if(!res.ok)return null;
      const t=await res.text();return t?JSON.parse(t):null;
    }catch{return null;}
  },[]);

  const startPolling=(id,sec)=>{
    stopPoll();
    let finishing=false;
    const tick=async()=>{
      const d=await fetchStatus(id,sec);
      if(!d)return;
      setCallData(d);
      if(TERMINAL.includes(normSt(d.status))&&!finishing){
        finishing=true;stopPoll();
        // Output variables can arrive a few seconds after the call ends.
        let latest=d;
        for(let i=0;i<8&&!(latest.result&&Object.keys(latest.result).length);i++){
          await new Promise(r=>setTimeout(r,3000));
          const n=await fetchStatus(id,sec);if(n){latest=n;setCallData(n);}
        }
      }
    };
    tick();pollRef.current=setInterval(tick,POLL_INTERVAL);
  };

  const openSection=k=>{stopPoll();setSection(k);setError(null);setCall(null);setCallData(null);setPage("section");};

  const startCall=async(agent,vals)=>{
    setDialog(null);setBusy(agent.id);setError(null);
    const custom=Object.fromEntries(Object.entries(vals||{}).filter(([,v])=>String(v).trim()!=="").map(([k,v])=>[k,String(v).trim()]));
    const payload={agent_id:agent.id,callee_name:user.firstName,mobile_number:fmtMobile(user.countryCode,user.mobile)};
    if(Object.keys(custom).length)payload.custom_data=custom;
    try{
      const res=await fetch(API_BASE+"/api/calls",{method:"POST",headers:headersFor(section),body:JSON.stringify(payload)});
      const text=await res.text();
      if(!text)throw new Error("Empty response from server");
      let data;
      try{data=JSON.parse(text);}catch{throw new Error(res.status===404?"The /api folder isn't deployed. Check the repo has an api/ folder at the top level.":`Server error (${res.status}). Try again.`);}
      if(!res.ok)throw new Error(data.error||data.message||data.detail||JSON.stringify(data));
      setCall({callId:data.id,agent});setCallData(data);setPage("monitor");startPolling(data.id,section);
    }catch(e){setError(e.message||"Network error");}
    finally{setBusy(null);}
  };

  const backToAgents=()=>{stopPoll();setCall(null);setCallData(null);setError(null);setPage("section");};
  const logout=()=>{stopPoll();setUser(null);setSection(null);setCall(null);setCallData(null);setPage("home");};

  let body;
  if(page==="about")body=<About/>;
  else if(page==="home"||!section)body=<SectionPicker onPick={openSection}/>;
  else if(!user)body=<DetailsScreen section={section} onSave={f=>setUser({...f,firstName:f.firstName.trim(),lastName:f.lastName.trim()})}/>;
  else if(page==="monitor"&&call)body=<Monitor section={section} call={call} data={callData} user={user} onBack={backToAgents}/>;
  else body=<AgentsScreen section={section} user={user} busy={busy} error={error} onCall={ag=>{setError(null);setDialog(ag);}}/>;

  const navBtn=(active)=>({display:"flex",alignItems:"center",gap:10,width:"100%",padding:"11px 12px",marginBottom:4,background:active?"rgba(255,255,255,.12)":"transparent",border:"none",borderRadius:10,cursor:"pointer",color:active?"#fff":"#B9C4D4",fontSize:14,fontWeight:active?700:500,textAlign:"left"});

  return(
    <div className="shell">
      <aside className="side">
        <div style={{padding:"24px 20px 18px"}}>
          <button onClick={()=>{stopPoll();setPage("home");setSection(null);}} style={{background:"none",border:"none",color:"#fff",cursor:"pointer",textAlign:"left",padding:0}}>
            <div style={{fontSize:20,fontWeight:800,letterSpacing:"-.02em"}}>Bajaj Voice AI</div>
            <div style={{fontSize:13,color:"#8FA0B8",marginTop:4}}>Powered by Hunar.ai</div>
          </button>
        </div>
        <nav style={{padding:"4px 12px",flex:1}}>
          {SECTION_ORDER.map(k=>{
            const s=SECTIONS[k], active=section===k&&page!=="about"&&page!=="home";
            return(
              <button key={k} onClick={()=>openSection(k)} style={navBtn(active)}>
                <SectionMark s={s} size={22} ring/>
                <span style={{flex:1}}>{s.short}</span>
                <span style={{fontSize:12,color:"#8FA0B8"}}>{s.agents.length}</span>
              </button>
            );
          })}
          <div style={{height:1,background:"rgba(255,255,255,.1)",margin:"10px 4px"}}/>
          <button onClick={()=>{stopPoll();setPage("about");}} style={navBtn(page==="about")}>About Hunar.ai</button>
        </nav>
        {user&&(
          <div className="side-foot" style={{padding:"14px 16px 18px",borderTop:"1px solid rgba(255,255,255,.1)",display:"flex",alignItems:"center",gap:10}}>
            <div style={{width:36,height:36,borderRadius:"50%",background:"rgba(255,255,255,.12)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:14,fontWeight:700}}>{user.firstName[0]}{user.lastName[0]}</div>
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontSize:14,fontWeight:600,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{user.firstName} {user.lastName}</div>
              <div style={{fontSize:12,color:"#8FA0B8"}}>{user.countryCode} {user.mobile}</div>
            </div>
            <button onClick={logout} title="Log out" aria-label="Log out" style={{background:"none",border:"none",color:"#B9C4D4",cursor:"pointer",padding:6,display:"flex"}}><LogOutIcon/></button>
          </div>
        )}
      </aside>
      <main className="main">{body}</main>
      {dialog&&<CallDialog agent={dialog} section={section} user={user} onCancel={()=>setDialog(null)} onStart={v=>startCall(dialog,v)}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
